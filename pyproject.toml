[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholaragent"
version = "1.0.0"
description = "ScholarAgent - evidence-grounded agentic RAG for scientific literature discovery, analysis and research-gap exploration"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: needs a CUDA GPU", "llm: needs the local LLM server running", "net: needs internet"]
